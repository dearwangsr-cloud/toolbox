<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 背景图层 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- 钱包主图案 -->
  <g filter="url(#shadow)" transform="translate(96, 112)">
    <!-- 钱包后盖/主卡槽 -->
    <path d="M 32 32 C 14.3 32 0 46.3 0 64 L 0 256 C 0 273.7 14.3 288 32 288 L 288 288 C 305.7 288 320 273.7 320 256 L 320 64 C 320 46.3 305.7 32 288 32 L 32 32 Z" fill="url(#walletGrad)"/>
    <!-- 钱包翻扣/扣环 -->
    <path d="M 224 128 C 206.3 128 192 142.3 192 160 C 192 177.7 206.3 192 224 192 L 320 192 C 320 156.8 320 128 320 128 L 224 128 Z" fill="#818cf8"/>
    <!-- 扣环锁扣扣眼 -->
    <circle cx="240" cy="160" r="14" fill="#ffffff"/>
  </g>
</svg>
